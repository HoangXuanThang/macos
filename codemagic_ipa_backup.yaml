# Codemagic CI/CD Configuration Backup for iOS IPA (BÁ VƯƠNG ĐẠI CHIẾN)
# Backup created for iOS IPA build

workflows:
  ios-ipa-workflow:
    name: Build iOS IPA (Cocos2d-x)
    max_build_duration: 120
    instance_type: mac_mini_m2
    
    environment:
      vars:
        XCODE_PROJECT: "MyLuaGame/frameworks/runtime-src/proj.ios_mac/MyLuaGame.xcodeproj"
        XCODE_SCHEME: "MyLuaGame-mobile"
        XCODE_TARGET: "MyLuaGame-mobile"
        XCODE_CONFIGURATION: "Release"
        APP_NAME: "BaVuongDaiChien"
      xcode: latest
      cocoapods: default

    scripts:
      - name: Prepare build environment and clean up junk files
        script: |
          echo "=== 1. Setting up build environment ==="
          find MyLuaGame/res MyLuaGame/src MyLuaGame/cocos MyLuaGame/updater -type f \( -name "*.DS_Store" -o -name "*.log" -o -name "*.tmp" -o -name "*.bak" -o -name "*.psd" -o -name "*.bat" \) -delete || true
          mkdir -p ../application
          if [ ! -f ../application/build.sh ]; then
            echo "#!/bin/bash" > ../application/build.sh
            echo "echo 'Application build pre-step executed.'" >> ../application/build.sh
            chmod +x ../application/build.sh
          fi
          chmod -R +x tools/ || true
          mkdir -p build/ios/ipa
          mkdir -p build/ios/deriveddata
          mkdir -p build/ios/archive

      - name: Initialize keychain and code signing profiles
        script: |
          echo "=== 2. Setting up iOS Code Signing ==="
          keychain initialize || true
          xcode-project use-profiles || true

      - name: Build Xcode Archive (.xcarchive)
        script: |
          echo "=== 3. Archiving Xcode Project ==="
          xcodebuild clean archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration "$XCODE_CONFIGURATION" \
            -derivedDataPath "build/ios/deriveddata" \
            -archivePath "build/ios/archive/$APP_NAME.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA Package
        script: |
          echo "=== 4. Packaging IPA with maximum compression ==="
          EXPORT_PLIST="MyLuaGame/frameworks/runtime-src/proj.ios_mac/ios/exportoptions.plist"
          if [ -d "$HOME/Library/MobileDevice/Provisioning Profiles" ] && [ "$(ls -A "$HOME/Library/MobileDevice/Provisioning Profiles")" ]; then
            echo "Signing profiles detected. Exporting signed IPA..."
            xcodebuild -exportArchive \
              -archivePath "build/ios/archive/$APP_NAME.xcarchive" \
              -exportOptionsPlist "$EXPORT_PLIST" \
              -exportPath "build/ios/ipa"
          else
            echo "No provisioning profile found. Generating Payload IPA package with max compression (-9)..."
            cd "build/ios/archive/$APP_NAME.xcarchive/Products/Applications"
            mkdir -p Payload
            cp -R "$XCODE_TARGET.app" Payload/
            zip -9 -r "$APP_NAME.ipa" Payload
            mv "$APP_NAME.ipa" "$CM_BUILD_DIR/build/ios/ipa/"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
