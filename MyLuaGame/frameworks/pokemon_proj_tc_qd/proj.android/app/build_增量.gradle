def genResSlim(srcDir) {
    def path = project.rootDir.toString().trim()
        path = path.substring(0, path.indexOf('MyLuaGame')) + 'tools/tjpack'

    def lang = 'cn'
    if (PROP_GAME_LANGUAGE) {
        lang = PROP_GAME_LANGUAGE
    }
    def slimArgs = ['res_slim.py', '--lang', lang, '--out_res', srcDir + '/res'] 
    println 'running command : ' + 'python ' + slimArgs.join(' ')
    exec {
        executable 'python'
        args slimArgs
        workingDir path
    }
}

def genCsv2Lua(srcDir) {
    def path = project.rootDir.toString().trim()
        path = path.substring(0, path.indexOf('MyLuaGame')) + 'tools/csv2lua'

    delete fileTree(srcDir) {
        include 'config/*'
    }

    def csv2luaArgs = [PROP_GAME_CSV2LUA_CFG, PROP_GAME_LANGUAGE]
    println 'running command : ' + 'python '  + csv2luaArgs.join(' ')
    exec {
        executable 'python'
        args csv2luaArgs
        workingDir path
    }

    println 'copy config lua : ' + path + '/config -> ' + srcDir + '/config'
    copy {
       from path + '/config'
       into srcDir + '/config'
    }
}

def encryptRes(srcDir) {
    def compileArgs = ['rescompile', '--res-path', srcDir, '--inplace']

    println 'running command : ' + 'cocos ' + compileArgs.join(' ')
     exec {
         executable getCocosCommandPath()
         args compileArgs
     }
}

def compileLua(srcDir, dstDir, doCompile, is64bit, doEncrypt) {
    def compileArgs = ['luacompile', '-s', srcDir, '-d', dstDir]

    println 'running command : ' + 'cocos ' + compileArgs.join(' ')
    exec {
        executable getCocosCommandPath()
        args compileArgs
    }

    delete fileTree(dstDir) {
        include '**/*.lua'
    }
}

android.applicationVariants.all { variant ->
    def proj_folder = "${buildDir}/../../../../.."
    def assets_folder = "${buildDir}/intermediates/assets"
    def pack_folder = assets_folder + "/androidpack"

    //delete assets_folder

    def targetName = variant.name.capitalize()
    def copyTaskName = "copy${targetName}ResourcesToAssets"

    tasks.register(copyTaskName) {
        //copy {
           //from proj_folder + "/res"
           //into pack_folder + "/res"
        //}

        copy {
            from "${buildDir}/../assets"
            into pack_folder
        }

		genResSlim(pack_folder)
        genCsv2Lua(pack_folder + "/src")
		
		copy {
           from proj_folder + "/cocos"
           into pack_folder + "/cocos"
        }

        copy {
            from proj_folder + "/updater"
            into pack_folder + "/updater"
        }

        copy {
            from proj_folder + "/src"
            into pack_folder + "/src"
        }

        def compileScript = (variant.name.compareTo('release') == 0)
        if (project.hasProperty('PROP_COMPILE_SCRIPT')) {
            compileScript = (PROP_COMPILE_SCRIPT.compareTo('1') == 0)
        }

        def encryptLua = project.hasProperty('PROP_LUA_ENCRYPT') && (PROP_LUA_ENCRYPT.compareTo('1') == 0)

        compileScript = encryptLua = true

        if (compileScript || encryptLua) {
            def buildType = -1
            if (compileScript) {
                def need64 = false
                def need32 = false
                def abis = PROP_APP_ABI.split(':').collect{it as String}
                abis.each{ abi->
                    if (abi.compareTo('arm64-v8a') == 0) {
                        need64 = true
                    }
                    else
                    {
                        need32 = true
                    }
                }

                need32 = need64 = false

                if (need64 && need32) {
                    buildType = 2
                }
                else if (need64) {
                    buildType = 1
                }
                else {
                    buildType = 0
                }
            }

            buildType = -1

            switch (buildType) {
                case -1:
                    compileLua(pack_folder + "/cocos",
                               pack_folder + "/cocos",
                               false, false, encryptLua)
                    compileLua(pack_folder + "/updater",
                               pack_folder + "/updater",
                               false, false, encryptLua)
                    compileLua(pack_folder + "/src",
                               pack_folder + "/src",
                               false, false, encryptLua)
                    break
            }

            //encryptRes(pack_folder)

            copy {
                from pack_folder
                into assets_folder
            }

            delete pack_folder

            copy {
                from "${buildDir}/../assets"
                into assets_folder
            }
        }
    }
    tasks.getByName("pre${targetName}Build").dependsOn copyTaskName
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(':libcocos2dx')
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation 'com.android.support:support-v4:27.1.1'
    implementation 'com.android.support:appcompat-v7:26+'
    implementation(name:'paysdk', ext:'aar')
}
