# Codemagic CI/CD Configuration for Android APK (BÁ VƯƠNG ĐẠI CHIẾN - Cocos2d-x)
# Codemagic 2026 Android Workflow Standard

workflows:
  android-apk-workflow:
    name: Build Signed Android APK (Cocos2d-x)
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      vars:
        ANDROID_PROJECT: "MyLuaGame/frameworks/pokemon_proj_tc_qd/proj.android"
      java: 1.8

    scripts:
      - name: Prepare environment and configure Android NDK
        script: |
          echo "=== 1. Setting up Android SDK & NDK Environment ==="
          
          # Detect Android SDK root
          SDK_DIR="$ANDROID_SDK_ROOT"
          if [ -z "$SDK_DIR" ]; then SDK_DIR="$ANDROID_HOME"; fi
          if [ -z "$SDK_DIR" ]; then SDK_DIR="/Users/builder/Library/Android/sdk"; fi
          
          # Detect or install Android NDK
          NDK_DIR=""
          if [ -d "$SDK_DIR/ndk-bundle" ]; then
            NDK_DIR="$SDK_DIR/ndk-bundle"
          else
            NDK_DIR=$(find "$SDK_DIR/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
          fi
          
          if [ -z "$NDK_DIR" ] || [ ! -d "$NDK_DIR" ]; then
            echo "Installing Android NDK via sdkmanager..."
            SDK_MANAGER=$(find "$SDK_DIR" -name "sdkmanager" | head -n 1)
            if [ -n "$SDK_MANAGER" ]; then
              yes | "$SDK_MANAGER" --licenses || true
              "$SDK_MANAGER" "ndk-bundle" || "$SDK_MANAGER" "ndk;21.4.7075529" || true
            fi
            NDK_DIR=$(find "$SDK_DIR/ndk" -maxdepth 1 -mindepth 1 2>/dev/null | sort -V | tail -n 1)
            if [ -z "$NDK_DIR" ] && [ -d "$SDK_DIR/ndk-bundle" ]; then NDK_DIR="$SDK_DIR/ndk-bundle"; fi
          fi
          
          echo "Found Android SDK: $SDK_DIR"
          echo "Found Android NDK: $NDK_DIR"
          
          # Generate clean local.properties for Gradle
          echo "sdk.dir=$SDK_DIR" > "$ANDROID_PROJECT/local.properties"
          if [ -n "$NDK_DIR" ]; then
            echo "ndk.dir=$NDK_DIR" >> "$ANDROID_PROJECT/local.properties"
          fi
          
          echo "=== local.properties contents ==="
          cat "$ANDROID_PROJECT/local.properties"

          chmod +x "$ANDROID_PROJECT/gradlew" || true
          chmod -R +x tools/ || true
          
          # Ensure dummy build script for application pre-step
          mkdir -p ../application
          if [ ! -f ../application/build.sh ]; then
            echo "#!/bin/bash" > ../application/build.sh
            echo "echo 'Pre-build step OK'" >> ../application/build.sh
            chmod +x ../application/build.sh
          fi

      - name: Build and Sign Android APK
        script: |
          echo "=== 2. Building Release APK with Gradle & Keystore ==="
          cd "$ANDROID_PROJECT"
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK Signature
        script: |
          echo "=== 3. Verifying Signed APK ==="
          APK_PATH=$(find "$ANDROID_PROJECT/app/build/outputs/apk" -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Signed APK generated successfully at: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "Error: APK not found!"
            exit 1
          fi

    artifacts:
      - MyLuaGame/frameworks/pokemon_proj_tc_qd/proj.android/app/build/outputs/apk/**/*.apk
