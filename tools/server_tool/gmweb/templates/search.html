<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <link rel="stylesheet" type="text/css" href="./static/blog.css" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/> 
    <title>{{ escape(handler.settings["blog_title"]) }}</title>
  </head>
  <body>
    <div id="body">
      <div id="header">
        <h1>{{ escape(handler.settings["blog_title"]) }}</h1>
        
      </div>
{% autoescape None %}

<table>
<tr>
<td>
  <input type="text" id="searchType" placeholder="searchType">
  <input type="text" id="serverName" placeholder="server">
  <input type="text" id="platform" placeholder="platform">
  <input type="text" id="channel" placeholder="channel">
  <input type="text" id="startDate" placeholder="startDate">
  <input type="text" id="endDate" placeholder="endDate">
  <input type="submit" id="submit" >
</td>

</tr>
<tr>
  <td>
    {{total}}
  </td>
</tr>
{%for result in resultList%}
<tr>

  {%for key in result.keys()%}
  <td>{{result[key]}}</td>
  {%end%}
</tr>
{%end%}

</table>




    </div>
  </body>

  <script src="https://code.jquery.com/jquery-2.2.4.min.js" integrity="sha256-BbhdlvQf/xTY9gja0Dq3HiwQF8LaCRTXxZKRutelT44=" crossorigin="anonymous"></script>

  <script type="text/javascript">
    $(document).ready(function(){
      $("#submit").click(function(){
        inputForms = ["serverName","platform","channel","startDate","endDate","searchType"];

        for (var i = inputForms.length - 1; i >= 0; i--) {
          
          if(!$("#"+inputForms[i]).val()){
            alert(inputForms[i]+"should not be empty!");
            return;
          }
        }

        args = "";
        for (var i = inputForms.length - 1; i >= 0; i--) {
          args+=inputForms[i]+"="+$("#"+inputForms[i]).val()+"&";

        }
        args = args.substring(0,args.length-1);
        console.log(args);
        url = "/search?"+args;
        window.location = url;



      });
    });
  </script>
</html>
